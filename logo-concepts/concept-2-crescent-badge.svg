<svg width="420" height="420" viewBox="0 0 420 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="chevron2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d62c9"/>
      <stop offset="55%" stop-color="#50b0f0"/>
      <stop offset="100%" stop-color="#9fd6ff"/>
    </linearGradient>
    <linearGradient id="chevronDark2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08306b"/>
      <stop offset="100%" stop-color="#0d62c9"/>
    </linearGradient>
  </defs>

  <circle cx="210" cy="210" r="200" fill="#f2f7ff"/>

  <!-- Crescent moon (Artemis symbol), large, forming the "C" the chevron sits inside -->
  <path d="M210,40 A170,170 0 1 0 210,380 A130,130 0 1 1 210,40 Z" fill="#1e3ea8"/>

  <!-- Power Automate chevron nested inside the crescent's open side, doubling as an arrowhead -->
  <g transform="translate(150,210)">
    <polygon points="0,-90 90,0 0,90 0,0" fill="url(#chevronDark2)"/>
    <polygon points="0,-90 140,0 90,0" fill="url(#chevron2)"/>
    <polygon points="0,90 140,0 90,0" fill="#bfe4ff"/>
  </g>
</svg>
