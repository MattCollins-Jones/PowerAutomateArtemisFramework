<svg width="980" height="420" viewBox="0 0 980 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="chevron3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d62c9"/>
      <stop offset="55%" stop-color="#50b0f0"/>
      <stop offset="100%" stop-color="#9fd6ff"/>
    </linearGradient>
    <linearGradient id="chevronDark3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08306b"/>
      <stop offset="100%" stop-color="#0d62c9"/>
    </linearGradient>
    <linearGradient id="bowWood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8a4a12"/>
      <stop offset="50%" stop-color="#d98324"/>
      <stop offset="100%" stop-color="#f0a94e"/>
    </linearGradient>
  </defs>

  <text x="459" y="45" font-family="Copperplate, 'Copperplate Gothic Bold', Cambria, Georgia, serif" font-weight="700" font-size="50" letter-spacing="3" fill="#1e3ea8" text-anchor="middle">POWER AUTOMATE</text>

  <g transform="translate(0,60)">
  <!-- Stag antlers, small silhouette above the bow grip, nodding to Artemis's sacred stag (the Ceryneian Hind) -->
  <g transform="translate(100,150)" stroke="#8a4a12" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M-6,-8 L-6,-40 L-18,-58 M-6,-30 L-22,-38 M-6,-52 L-16,-64"/>
    <path d="M6,-8 L6,-40 L18,-58 M6,-30 L22,-38 M6,-52 L16,-64"/>
  </g>

  <!-- Bow: tapered limbs (thicker at the grip, narrowing to the tips), a grip wrap, and tip nocks -->
  <path d="M100,60 Q175,150 100,240" fill="none" stroke="url(#bowWood)" stroke-width="14" stroke-linecap="round"/>
  <path d="M100,60 Q175,150 100,240" fill="none" stroke="#5c2e0a" stroke-width="14" stroke-linecap="round" stroke-dasharray="0.1,999" />
  <!-- Taper overlay: thinner strokes nearer the tips to suggest a recurve profile -->
  <path d="M100,60 Q140,95 155,120" fill="none" stroke="url(#bowWood)" stroke-width="9" stroke-linecap="round"/>
  <path d="M100,240 Q140,205 155,180" fill="none" stroke="url(#bowWood)" stroke-width="9" stroke-linecap="round"/>

  <!-- Grip wrap at the centre of the bow -->
  <g stroke="#5c2e0a" stroke-width="3">
    <line x1="86" y1="140" x2="100" y2="144"/>
    <line x1="85" y1="148" x2="100" y2="152"/>
    <line x1="86" y1="156" x2="100" y2="160"/>
    <line x1="88" y1="164" x2="101" y2="167"/>
  </g>

  <!-- Bow string, faint, running tip to tip -->
  <path d="M100,60 Q80,150 100,240" fill="none" stroke="#3a2210" stroke-width="2.5" opacity="0.6"/>

  <!-- Tip nocks -->
  <circle cx="100" cy="60" r="6" fill="#5c2e0a"/>
  <circle cx="100" cy="240" r="6" fill="#5c2e0a"/>

  <!-- Arrow shaft, back to Power Automate blue -->
  <line x1="90" y1="150" x2="620" y2="150" stroke="#5b7fd6" stroke-width="16" stroke-linecap="round"/>

  <!-- Chevron arrowhead, same geometry as current Power Automate logo -->
  <g>
    <polygon points="620,60 740,150 620,240 620,150" fill="url(#chevronDark3)"/>
    <polygon points="620,60 840,150 740,150" fill="url(#chevron3)"/>
    <polygon points="620,240 840,150 740,150" fill="#bfe4ff"/>
  </g>

  <!-- Small crescent moon nock at the back of the arrow (Artemis nod) -->
  <path d="M78,130 A20,20 0 1 1 78,170 A15,15 0 1 0 78,130 Z" fill="#5b7fd6"/>
  </g>

  <text x="459" y="405" font-family="Copperplate, 'Copperplate Gothic Bold', Cambria, Georgia, serif" font-weight="700" font-size="50" letter-spacing="3" fill="#1e3ea8" text-anchor="middle">ARTEMIS FRAMEWORK</text>
</svg>
